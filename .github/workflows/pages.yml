name: Deploy frontend to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Verify GitHub Pages is enabled
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          code=$(curl --silent --output pages.json --write-out "%{http_code}" \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages")
          if [ "$code" != "200" ]; then
            echo "::error title=GitHub Pages is not enabled::Open repository Settings → Pages, set Source to GitHub Actions, save it, then rerun this workflow. The frontend build has not failed; the repository has no Pages site for deploy-pages to target."
            echo "## Deployment needs one repository setting" >> "$GITHUB_STEP_SUMMARY"
            echo "Open **Settings → Pages** and choose **GitHub Actions** under **Build and deployment → Source**. Then rerun this workflow." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build static frontend
        run: |
          mkdir -p _site/assets _site/data _site/node_modules/d3/dist
          cp index.html learn.html styles.css learn.css app.js learn.js config.js _site/
          cp -R assets/. _site/assets/
          cp data/countries-110m.geojson data/countries-110m.js _site/data/
          cp node_modules/d3/dist/d3.min.js _site/node_modules/d3/dist/
          touch _site/.nojekyll
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
